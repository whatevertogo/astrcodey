[package]
name = "s5r-guest-demo"
version = "0.3.14"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[[bin]]
name = "s5r_guest_demo"
path = "src/main.rs"

[dependencies]
astrcode-extension-sdk = { path = "../../../astrcode-extension-sdk" }
astrcode-extension-worker = { path = "../../../astrcode-extension-worker", features = ["testing"] }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
