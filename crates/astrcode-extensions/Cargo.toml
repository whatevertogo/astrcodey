[package]
name = "astrcode-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extension/hook system: lifecycle events, hook modes, extension loading and dispatch"

[dependencies]
astrcode-core = { path = "../astrcode-core" }
astrcode-session-projection = { path = "../astrcode-session-projection" }
astrcode-storage = { path = "../astrcode-storage" }
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = ["job-object", "kill-on-drop", "tokio1"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
astrcode-storage = { path = "../astrcode-storage", features = ["testing"] }
tempfile = { workspace = true }
