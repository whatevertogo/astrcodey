[package]
name = "astrcode-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session persistence: JSONL event log and config storage"

[features]
# 启用纯内存事件存储实现，用于集成测试和测试辅助启动路径。
# 不应在生产构建中启用。
testing = []

[dependencies]
astrcode-core = { path = "../astrcode-core" }
astrcode-session-projection = { path = "../astrcode-session-projection" }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
fs2 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "session_repo"
harness = false
required-features = ["testing"]
