[package]
name = "astrcode-extension-ask-user"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive askUser extension"

[dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
async-trait = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk", features = ["testing"] }
