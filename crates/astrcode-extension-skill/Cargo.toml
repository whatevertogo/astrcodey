[package]
name = "astrcode-extension-skill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude-style skill discovery and Skill tool extension"

[dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
noyalib = { workspace = true }

[dev-dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
