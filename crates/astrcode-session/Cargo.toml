[package]
name = "astrcode-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session runtime: Session handle, turn execution, and event bus"

[dependencies]
astrcode-core = { path = "../astrcode-core" }
astrcode-context = { path = "../astrcode-context" }
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
astrcode-storage = { path = "../astrcode-storage" }
astrcode-session-projection = { path = "../astrcode-session-projection" }
arc-swap = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }
tokio-util = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
astrcode-storage = { path = "../astrcode-storage", features = ["testing"] }
