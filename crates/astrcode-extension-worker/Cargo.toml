[package]
name = "astrcode-extension-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "S5R worker-side runtime for AstrCode extensions"

[features]
default = []
testing = []

[dependencies]
astrcode-extension-sdk = { path = "../astrcode-extension-sdk" }
astrcode-s5r-runtime = { path = "../astrcode-s5r-runtime" }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
