name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-07-27

jobs:
  # ── Rust ──────────────────────────────────────────────────────────

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Prepare desktop sidecar
        run: node frontend/scripts/prepare-sidecar.mjs
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Prepare desktop sidecar
        run: node frontend/scripts/prepare-sidecar.mjs
      - name: Build s5r guest binary (E2E)
        run: cargo build --release --manifest-path crates/astrcode-extensions/tests/s5r-guest/Cargo.toml
      - name: Run S5R 3.0 worker conformance
        run: >-
          cargo run -p astrcode-extension-sdk --features conformance --bin s5r-conformance --
          --extension-id s5r-guest-demo --
          crates/astrcode-extensions/tests/s5r-guest/target/release/s5r_guest_demo
      - run: cargo test --workspace --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny unsound

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  deps:
    name: Dependency Direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-deps.py
      - name: Reject unstable Rust features
        shell: bash
        run: |
          if git grep -n -E '#![[:space:]]*\[[[:space:]]*feature[[:space:]]*\(' -- '*.rs'; then
            echo 'workspace Rust sources must compile on stable without #![feature(...)]' >&2
            exit 1
          fi

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.os }}
      - name: Prepare desktop sidecar
        run: node frontend/scripts/prepare-sidecar.mjs
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo check --manifest-path crates/astrcode-extensions/tests/s5r-guest/Cargo.toml --all-targets

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Prepare desktop sidecar
        run: node frontend/scripts/prepare-sidecar.mjs
      - run: cargo check --workspace --all-targets --all-features

  # ── Python SDK ────────────────────────────────────────────────────

  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python SDK tests
        working-directory: sdks/python
        run: PYTHONPATH=src python3 -m unittest discover -s tests

  python-conformance:
    name: Python worker conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Run S5R 3.0 conformance against the Python worker
        run: >-
          PYTHONPATH=sdks/python/src
          cargo run -p astrcode-extension-sdk --features conformance --bin s5r-conformance --
          --extension-id s5r-echo-example --
          python3 sdks/python/examples/echo_extension.py

  # ── Frontend ──────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  frontend-format:
    name: Frontend format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend

  contract-test:
    name: Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run test:contract
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Build ─────────────────────────────────────────────────────────

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: astrcode
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: astrcode
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary: astrcode
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: astrcode
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: astrcode.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            binary: astrcode.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: astrcode-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
